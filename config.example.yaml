# 期权天眼 配置模板（config.example.yaml）
# 复制为 config.yaml 后按需修改。本文件不含任何密钥，可安全提交。

# Deribit 连接
deribit:
  testnet: false                 # 交易用测试网（不影响公共数据）
  public_ws: "wss://www.deribit.com/ws/api/v2"  # 数据走主网（有真实期权链）
  trade_ws: "wss://test.deribit.com/ws/api/v2"  # 交易走测试网
  # ticker 推送间隔：仅 100ms 与 raw（需认证）在公共连接上实际推送；
  # 1s / 5s / 1m 在公共 API 上实测不推送，请勿使用。
  ticker_interval: "100ms"

# 策略范围过滤（全部可调）
filters:
  min_dte: 7                     # 最小到期日
  max_dte: 365                   # 最大到期日
  delta_min: 0.05                # Delta 下限
  delta_max: 0.25                # Delta 上限
  min_oi: 10                     # 最小 OI（张数）
  min_volume_24h: 0              # 最小 24h 成交量
  z_score_threshold: 2.0         # Z-score 偏差阈值

# SABR 校准
sabr:
  beta: 0.7                      # 固定 β
  alpha_min: 0.01
  alpha_max: 30.0
  rho_min: -0.8
  rho_max: 0.5
  nu_min: 0.05
  nu_max: 2.0
  calibrate_interval_sec: 30
  min_strikes_per_expiry: 5
  max_data_age_minutes: 5
  max_price_change_pct: 5.0
  extreme_vol_window_days: 7

# 扫描频率
scan:
  chain_snapshot_interval_sec: 5
  signal_interval_sec: 30
  price_smooth_minutes: 5
  instrument_refresh_sec: 300    # 合约列表刷新+重建 ticker 订阅周期

# Web 服务
web:
  host: "127.0.0.1"
  port: 5051

# 推送通知
notification:
  enabled: true

  email:
    enabled: false
    from_addr: "你的发件邮箱"
    to_addr: "你的收件邮箱"

  telegram:
    enabled: true
    # 下面两值仅本地 config.yaml 填写（gitignored，不入库）；此处留空占位
    # 也可通过环境变量 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID 提供
    bot_token: ""
    chat_id: ""

# 日志
logging:
  level: "INFO"
  file: "logs/options-eye.log"
  max_size_mb: 10
  backup_count: 3

# VRP 反转信号模块（W1 / Wasserstein on RND）
# 纯只读旁路，复用主流程 IV 曲面/SABR 数据，不发起新 WebSocket
w1:
  enabled: true
  tenors: [7, 30]               # 目标到期天数：30D 主哨 + 7D 早哨
  lags_days: [1, 3, 7]          # 快照间隔（天）：k=1/3/7，用于 jump/trend 轮廓分类
  snapshot_mode: hourly         # hourly=每整点(UTC)存一帧实时积累历史surface
  snapshot_utc_hour: 0          # daily 模式基准 UTC 钟点
  min_snapshot_gap_sec: 3500    # 整点模式防同整点窗口重复记帧的最小间隔
  eval_interval_sec: 60         # 循环评估间隔
  jump_ratio_threshold: 2.5     # ratio=W1(t,t-7)/W1(t,t-1) > 该值 判 trend 型丢弃
  trigger_w1_min: 0.02          # 占位固定阈值（OOS 后改为样本分位 walk-forward 阈值）
  history_path: "data/w1_rnd_history.json"
  max_history_days: 120
