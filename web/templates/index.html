<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期权天眼</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: #eef1f5; color: #1f2733; font-size: 14px; line-height: 1.5; }
.header { background: linear-gradient(90deg,#1a3a6b,#2b5ca8); color:#fff; padding: 12px 24px; display: flex; align-items: center; gap: 18px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.header h1 { font-size: 18px; font-weight: 700; letter-spacing: .5px; }
.header .status { font-size: 12px; color: #cfe0ff; margin-left: auto; display:flex; align-items:center; gap:16px; }
.header .price { font-variant-numeric: tabular-nums; font-weight:600; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
.badge-running { background: #1b9e57; color: #fff; }
.badge-stopped { background: #c0392b; color: #fff; }
.container { display: flex; gap: 18px; padding: 18px; max-width: 1860px; margin: 0 auto; align-items: flex-start; }
.sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; position: sticky; top: 18px; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.card { background: #fff; border-radius: 12px; border: 1px solid #e3e8ef; overflow: hidden; box-shadow: 0 1px 3px rgba(20,40,80,.06); }
.card-header { padding: 13px 18px; border-bottom: 1px solid #eef1f5; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; background:#fafbfc; }
.card-body { padding: 16px 18px; }
.heatmap-controls { display: flex; gap: 8px; align-items: center; margin-left: auto; flex-wrap: wrap; }
.heatmap-btn { padding: 5px 14px; border-radius: 7px; border: 1px solid #d4dbe6; background: #fff; cursor: pointer; font-size: 12px; color:#44506a; transition: all .15s; }
.heatmap-btn:hover { border-color:#2b5ca8; color:#2b5ca8; }
.heatmap-btn.active { background: #2b5ca8; color: #fff; border-color: #2b5ca8; }
.heatmap-wrapper { overflow-x: auto; padding-bottom: 6px; }
.heatmap-table { border-collapse: separate; border-spacing: 3px; font-size: 13px; margin: 0 auto; }
.heatmap-table th { padding: 6px 4px; text-align: center; font-weight: 600; color:#65718a; font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: #fafbfc; z-index: 1; }
.heatmap-table td { min-width: 66px; height: 46px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; transition: transform .1s; text-align: center; vertical-align: middle; }
.heatmap-table td:hover { transform: scale(1.08); outline: 2px solid #2b5ca8; outline-offset: -2px; z-index: 3; position: relative; }
.heatmap-table td.anomaly { outline: 2px solid #e53935; outline-offset: -2px; }
.heatmap-table td.anomaly-neg { outline: 2px solid #1e88e5; outline-offset: -2px; }
.heatmap-legend { display:flex; gap:24px; flex-wrap:wrap; margin-top:14px; padding-top:12px; border-top:1px solid #eef1f5; font-size:12px; color:#65718a; align-items:center; }
.legend-bar { height:12px; width:220px; border-radius:6px; display:inline-block; }
.legend-item { display:flex; align-items:center; gap:6px; }
.legend-swatch { width:14px; height:14px; border-radius:3px; display:inline-block; }
.param-group { margin-bottom: 14px; }
.param-label { font-size: 12px; color: #65718a; margin-bottom: 4px; display:flex; justify-content:space-between; }
.param-row { display: flex; align-items: center; gap: 10px; }
.param-row input[type="range"] { flex: 1; accent-color:#2b5ca8; }
.param-val { font-size: 13px; font-weight: 700; color:#1f2733; min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
.signal-card { padding: 12px 16px; border: 1px solid #e3e8ef; border-radius: 10px; margin-bottom: 10px; cursor: pointer; transition: background .15s, border-color .15s; font-size: 14px; }
.signal-card:hover { background: #f5f9ff; border-color:#bcd2f5; }
.signal-card .title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.signal-card .sub { font-size: 13px; color: #65718a; line-height:1.7; }
.signal-card .actions { display: flex; gap: 8px; margin-top: 8px; }
.signal-card .actions button { padding: 6px 16px; border-radius: 6px; border: 1px solid #d4dbe6; font-size: 13px; cursor: pointer; background: #fff; color:#44506a; transition:all .15s; }
.signal-card .actions button:hover { border-color:#2b5ca8; }
.signal-card .actions .btn-execute { background: #2b5ca8; color: #fff; border-color: #2b5ca8; font-weight:600; }
.signal-card .actions .btn-execute:hover { background:#1a3a6b; }
.detail-panel { padding: 14px; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin: 12px 0; }
.detail-item .label { font-size: 11px; color: #9aa6ba; }
.detail-item .value { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cred-form { display: flex; flex-direction: column; gap: 8px; }
.cred-form input { width: 100%; padding: 9px 11px; border: 1px solid #d4dbe6; border-radius: 7px; font-size: 13px; box-sizing: border-box; }
.cred-form input:focus { outline:none; border-color:#2b5ca8; }
.cred-form button { width: 100%; padding: 9px 14px; border-radius: 7px; border: 1px solid #2b5ca8; background: #2b5ca8; color: #fff; cursor: pointer; font-size: 13px; font-weight: 600; }
.status-bar { display: flex; gap: 14px; padding: 4px 0; font-size: 12px; color: #65718a; flex-wrap:wrap; }
.status-bar b { color:#1f2733; font-size:14px; }
.gl-form { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
.gl-form input { flex:1; min-width:120px; padding:8px 11px; border:1px solid #d4dbe6; border-radius:7px; font-size:13px; }
.gl-form input:focus { outline:none; border-color:#2b5ca8; }
.gl-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.gl-row select, .gl-row input { padding:6px 10px; border:1px solid #d4dbe6; border-radius:7px; font-size:13px; }
.gl-params { margin-top:12px; padding:12px 14px; background:#f7f9fc; border-radius:9px; font-size:13px; }
.gl-params .row { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px dashed #e3e8ef; }
.gl-params .row:last-child { border-bottom:none; }
.gl-params .k { color:#65718a; }
.gl-params .v { font-weight:600; font-variant-numeric:tabular-nums; }
.gl-state { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
.gl-state-run { background:#e3f5ea; color:#1b9e57; }
.gl-state-stop { background:#fdecea; color:#c0392b; }
.pos-summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin-bottom:14px; padding:12px; background:#f7f9fc; border-radius:10px; }
.pos-summary .cell .l { font-size:11px; color:#9aa6ba; }
.pos-summary .cell .n { font-size:17px; font-weight:700; font-variant-numeric:tabular-nums; }
.pos-card { padding:12px 16px; border:1px solid #e3e8ef; border-radius:10px; margin-bottom:10px; }
.pos-card .top { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
.pos-card .ttl { font-weight:700; font-size:14px; }
.pos-card .meta { font-size:11px; color:#aab4c4; margin-top:2px; }
.pos-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(86px,1fr)); gap:6px; margin:8px 0; font-size:12px; }
.pos-grid .g .k { color:#9aa6ba; font-size:11px; }
.pos-grid .g .v { font-weight:600; font-variant-numeric:tabular-nums; }
.pnl-big { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; }
@keyframes pulse { 0% { opacity: 1; } 50% { opacity: .45; } 100% { opacity: 1; } }
.loading { animation: pulse 1.5s ease-in-out infinite; }
.pos-note { font-size:11px; color:#aab4c4; margin-top:8px; }
</style>
</head>
<body>

<div class="header">
  <h1>期权天眼</h1>
  <span id="header-status" class="badge badge-stopped">停止</span>
  <span style="font-size:13px;color:#cfe0ff;">BTC <span id="header-btc-price" class="price">--</span></span>
  <span id="header-time" style="font-size:13px;color:#cfe0ff;margin-left:auto;"></span>
</div>

<div class="container">
  <div class="sidebar">
    <div class="card">
      <div class="card-header">参数面板</div>
      <div class="card-body">
        <div class="param-group">
          <div class="param-label"><span>最小 DTE</span><span class="param-val" id="param-dte-val">7</span></div>
          <div class="param-row"><input type="range" id="param-dte" min="1" max="60" value="7"></div>
        </div>
        <div class="param-group">
          <div class="param-label"><span>Delta 下限</span><span class="param-val" id="param-dmin-val">0.05</span></div>
          <div class="param-row"><input type="range" id="param-dmin" min="1" max="30" value="5"></div>
        </div>
        <div class="param-group">
          <div class="param-label"><span>Delta 上限</span><span class="param-val" id="param-dmax-val">0.25</span></div>
          <div class="param-row"><input type="range" id="param-dmax" min="10" max="50" value="25"></div>
        </div>
        <div class="param-group">
          <div class="param-label"><span>Z-score 阈值</span><span class="param-val" id="param-z-val">2.0</span></div>
          <div class="param-row"><input type="range" id="param-z" min="5" max="40" value="20"></div>
        </div>
        <div class="param-group">
          <div class="param-label"><span>最小 OI</span><span class="param-val" id="param-oi-val">10</span></div>
          <div class="param-row"><input type="range" id="param-oi" min="0" max="100" step="5" value="10"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">Deribit 交易凭证</div>
      <div class="card-body">
        <div class="cred-form">
          <input type="text" id="cred-id" placeholder="Client ID（测试网）">
          <input type="password" id="cred-secret" placeholder="Client Secret">
          <button onclick="setCredentials()">保存连接</button>
        </div>
        <div id="cred-status" style="font-size:12px;color:#65718a;margin-top:8px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">状态</div>
      <div class="card-body">
        <div class="status-bar">
          <span>切片 <b id="stat-slices">0</b></span>
          <span>校准 <b id="stat-cal">0</b></span>
          <span>偏差 <b id="stat-dev">0</b></span>
          <span>信号 <b id="stat-sig">0</b></span>
        </div>
        <div class="status-bar" style="margin-top:8px;color:#aab4c4;">数据每 3 秒刷新</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="card">
      <div class="card-header">
        IV 曲面热力图
        <div class="heatmap-controls">
          <button class="heatmap-btn active" onclick="switchView('abs')" id="view-abs">IV 绝对值</button>
          <button class="heatmap-btn" onclick="switchView('dev')" id="view-dev">SABR 偏差</button>
          <span style="width:1px;height:18px;background:#d4dbe6;margin:0 4px;"></span>
          <button class="heatmap-btn active" onclick="switchCurr('BTC')" id="curr-btc">BTC</button>
          <button class="heatmap-btn" onclick="switchCurr('ETH')" id="curr-eth">ETH</button>
        </div>
      </div>
      <div class="card-body">
        <div class="heatmap-wrapper" id="heatmap-container">
          <div style="text-align:center;padding:50px;color:#9aa6ba;" class="loading">等待数据...</div>
        </div>
        <div class="heatmap-legend" id="heatmap-legend"></div>
      </div>
    </div>

    <div class="card" id="detail-card" style="display:none;">
      <div class="card-header">合约详情 <span id="detail-inst" style="font-weight:400;color:#65718a;"></span></div>
      <div class="card-body">
        <div class="detail-grid" id="detail-grid"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">策略信号 <span id="signal-count" style="font-weight:400;color:#9aa6ba;"></span></div>
      <div class="card-body" id="signal-list">
        <div style="text-align:center;padding:24px;color:#9aa6ba;">暂无信号</div>
      </div>
    </div>

    <!-- 策略持仓管理 -->
    <div class="card" id="positions-card">
      <div class="card-header">
        策略持仓 <span id="pos-count" style="font-weight:400;color:#9aa6ba;"></span>
        <div style="margin-left:auto;display:flex;gap:6px;">
          <button class="heatmap-btn" onclick="refreshPositions()" style="font-size:12px;">刷新</button>
        </div>
      </div>
      <div class="card-body" id="positions-body">
        <div style="text-align:center;padding:24px;color:#9aa6ba;">暂无持仓</div>
      </div>
    </div>

    <!-- 格致 Trial Forge 对冲 -->
    <div class="card" id="gl-hedge-card">
      <div class="card-header">格致 Trial Forge 对冲</div>
      <div class="card-body">
        <div class="gl-form">
          <input type="text" id="gl-email" placeholder="格致邮箱">
          <input type="password" id="gl-pwd" placeholder="密码">
          <button onclick="glLogin()" style="padding:8px 16px;border-radius:7px;border:1px solid #2b5ca8;background:#2b5ca8;color:#fff;cursor:pointer;font-size:13px;font-weight:600;flex:0 0 auto;">登录</button>
        </div>
        <div class="gl-row">
          <select id="gl-currency" onchange="glStatus()">
            <option value="BTC">BTC</option>
            <option value="ETH">ETH</option>
          </select>
          <input type="number" id="gl-target" value="0" step="0.1" style="width:90px;" title="目标 Delta（0=中性）">
          <input type="number" id="gl-band" value="0.5" step="0.1" style="width:90px;" title="允许偏离带">
          <button class="heatmap-btn" onclick="glStart()">启动对冲</button>
          <button class="heatmap-btn" onclick="glStop()">停止</button>
          <button class="heatmap-btn" onclick="glStatus()">查询状态</button>
        </div>
        <div id="gl-status" style="font-size:12px;color:#65718a;margin-top:8px;"></div>
        <div class="gl-params" id="gl-params" style="display:none;"></div>
      </div>
    </div>
  </div>
</div>

<script>
// ---- 状态 ----
let viewMode = 'abs';
let selectedCurr = 'BTC';
let currentData = null;
const NO_DATA = '等待数据...';

// ---- 参数同步（滑块变化即时下发后端，主循环下一轮生效）----
function readSliderVal(k) {
  var el = document.getElementById('param-' + k);
  if (!el) return null;
  if (k === 'dmin' || k === 'dmax') return parseInt(el.value) / 100;
  if (k === 'z') return parseInt(el.value) / 10;
  return parseFloat(el.value);
}
['dte','dmin','dmax','z','oi'].forEach(function(k) {
  var el = document.getElementById('param-' + k);
  var vl = document.getElementById('param-' + k + '-val');
  if (el && vl) {
    el.addEventListener('input', function() {
      var v = readSliderVal(k);
      vl.textContent = (k==='dmin'||k==='dmax') ? v.toFixed(2) : (k==='z' ? v.toFixed(1) : v);
    });
    // change 时下发后端（避免拖动过程中频繁请求）
    el.addEventListener('change', syncParams);
  }
});

async function syncParams() {
  var body = {
    min_dte: readSliderVal('dte'),
    delta_min: readSliderVal('dmin'),
    delta_max: readSliderVal('dmax'),
    z_threshold: readSliderVal('z'),
    min_oi: readSliderVal('oi')
  };
  try {
    await fetch('/api/params', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
  } catch(e) { console.log('syncParams error:', e); }
}

// 页面加载时从后端回填滑块值（保持刷新后一致）
async function loadParams() {
  try {
    var r = await fetch('/api/params');
    var d = await r.json();
    var p = d.runtime_params || {};
    if (p.min_dte != null) { document.getElementById('param-dte').value = p.min_dte; document.getElementById('param-dte-val').textContent = p.min_dte; }
    if (p.delta_min != null) { document.getElementById('param-dmin').value = p.delta_min*100; document.getElementById('param-dmin-val').textContent = p.delta_min.toFixed(2); }
    if (p.delta_max != null) { document.getElementById('param-dmax').value = p.delta_max*100; document.getElementById('param-dmax-val').textContent = p.delta_max.toFixed(2); }
    if (p.z_threshold != null) { document.getElementById('param-z').value = p.z_threshold*10; document.getElementById('param-z-val').textContent = p.z_threshold.toFixed(1); }
    if (p.min_oi != null) { document.getElementById('param-oi').value = p.min_oi; document.getElementById('param-oi-val').textContent = p.min_oi; }
  } catch(e) { console.log('loadParams error:', e); }
}
loadParams();

// ---- 数据轮询 ----
async function fetchData() {
  try {
    var [stat, slices, devs, signals] = await Promise.all([
      fetch('/api/status').then(function(r) { return r.json(); }),
      fetch('/api/slices').then(function(r) { return r.json(); }),
      fetch('/api/deviations').then(function(r) { return r.json(); }),
      fetch('/api/signals').then(function(r) { return r.json(); }),
    ]);

    document.getElementById('stat-slices').textContent = stat.slices;
    document.getElementById('stat-cal').textContent = stat.sabr_params;
    document.getElementById('stat-dev').textContent = stat.deviations;
    document.getElementById('stat-sig').textContent = stat.signals;

    var hdr = document.getElementById('header-status');
    if (stat.running) {
      hdr.textContent = '运行中';
      hdr.className = 'badge badge-running';
    } else {
      hdr.textContent = '停止';
      hdr.className = 'badge badge-stopped';
    }

    document.getElementById('header-time').textContent =
      stat.last_update ? new Date(stat.last_update * 1000).toLocaleTimeString() : '--';

    // BTC 价按币种定位
    if (slices.slices && slices.slices.length > 0) {
      var btcSlice = slices.slices.find(function(s) { return s.currency === 'BTC'; });
      var fwd = btcSlice ? btcSlice.forward : slices.slices[0].forward;
      if (fwd) document.getElementById('header-btc-price').textContent =
        fwd.toLocaleString(undefined, {maximumFractionDigits: 0});
    }

    currentData = {slices: slices, devs: devs, signals: signals};
    renderHeatmap();
    renderSignals();

    // 交易凭证状态（自动恢复提示，仅首次设置避免每 3s 覆盖已保存的状态）
    var credEl = document.getElementById('cred-status');
    if (stat.trader_ready) {
      if (!credEl.textContent || credEl.textContent.indexOf('已') !== 0) {
        credEl.textContent = '已连接（重启后自动恢复）';
        credEl.style.color = '#1b9e57';
      }
    } else {
      if (!credEl.textContent || credEl.textContent.indexOf('请') !== 0) {
        credEl.textContent = '请填写测试网 Client ID 和 Secret';
        credEl.style.color = '#c0392b';
      }
    }

    // 格致对冲状态
    var glStatusEl = document.getElementById('gl-status');
    if (stat.gl_ready) {
      if (!glStatusEl.textContent || glStatusEl.textContent.indexOf('已登录') !== 0) {
        glStatusEl.textContent = '已登录（重启后自动恢复）';
        glStatusEl.style.color = '#1b9e57';
        // 自动查询对冲状态和参数
        setTimeout(glStatus, 200);
      }
    }

  } catch(e) {
    console.log('fetch error:', e);
  }
}

setInterval(fetchData, 3000);
fetchData();

// ---- 热力图 ----
function renderHeatmap() {
  var container = document.getElementById('heatmap-container');
  if (!currentData || !currentData.slices || !currentData.slices.slices ||
      currentData.slices.slices.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:50px;color:#9aa6ba;" class="loading">' + NO_DATA + '</div>';
    return;
  }

  var slices = currentData.slices.slices.filter(function(s) { return s.currency === selectedCurr; });
  var devs = currentData.devs.deviations || [];
  var rows = slices;  // 全量到期日，不截断
  if (rows.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:50px;color:#9aa6ba;" class="loading">' + NO_DATA + '</div>';
    return;
  }

  var deltaBuckets = [-0.25, -0.20, -0.15, -0.10, -0.05, 0.05, 0.10, 0.15, 0.20, 0.25];
  var deltaLabels = ['-0.25','-0.20','-0.15','-0.10','-0.05','+0.05','+0.10','+0.15','+0.20','+0.25'];

  var devMap = {};
  devs.forEach(function(d) { devMap[d.instrument] = d; });

  // 按币种动态计算 IV 范围（ABS 模式用，避免 BTC/ETH 不同基线导致误色）
  var minIv = Infinity, maxIv = -Infinity;
  if (viewMode === 'abs') {
    rows.forEach(function(r) {
      (r.calls || []).concat(r.puts || []).forEach(function(c) {
        if (c.iv > 0) { if (c.iv < minIv) minIv = c.iv; if (c.iv > maxIv) maxIv = c.iv; }
      });
    });
    if (minIv === Infinity) { minIv = 0.3; maxIv = 0.7; }
    if (maxIv - minIv < 0.01) { minIv -= 0.05; maxIv += 0.05; }
  }

  function cellColor(iv, mode) {
    if (mode === 'abs') {
      // 按币种 IV 范围相对归一化：低→蓝(240°)，高→红(0°)，HSL 插值
      var t = (iv - minIv) / (maxIv - minIv);
      t = Math.max(0, Math.min(1, t));
      var h = 240 - t * 210;
      return 'hsl(' + Math.round(h) + ',75%,50%)';
    } else {
      if (iv >= 4) return '#c62828';
      if (iv >= 2) return '#e53935';
      if (iv >= 0.5) return '#ffcdd2';
      if (iv >= -0.5) return '#f5f5f5';
      if (iv >= -2) return '#bbdefb';
      return '#1565c0';
    }
  }
  function textColor(bg) {
    // HSL 颜色统一用白色（75% 饱和度 + 50% 明度下白色可读）
    if (bg.indexOf('hsl') === 0) return '#fff';
    var dark = ['#c62828','#e53935','#fb8c00','#1565c0','#1a3a6b'];
    return dark.indexOf(bg) >= 0 ? '#fff' : '#333';
  }

  var html = '<table class="heatmap-table"><thead><tr><th>DTE</th>';
  deltaLabels.forEach(function(l) { html += '<th>' + l + '</th>'; });
  html += '<th style="font-size:11px;color:#9aa6ba;">偏斜</th></tr></thead><tbody>';

  rows.forEach(function(r) {
    html += '<tr><td style="font-weight:700;color:#65718a;text-align:center;font-size:12px;background:#f0f3f8;border-radius:5px;">' + r.dte + 'd</td>';

    var allContracts = (r.calls || []).map(function(c) { c.absDelta = Math.abs(c.delta || 0); return c; })
      .concat((r.puts || []).map(function(p) { p.absDelta = Math.abs(p.delta || 0); return p; }));

    function findNearest(targetDelta) {
      var best = null, bestDiff = 999;
      allContracts.forEach(function(x) {
        var diff = Math.abs(x.delta - targetDelta);
        if (diff < bestDiff) { bestDiff = diff; best = x; }
      });
      return best;
    }

    var rowVals = [];
    deltaBuckets.forEach(function(db) {
      var contract = findNearest(db);
      if (!contract) { html += '<td style="background:#f5f5f5;"></td>'; rowVals.push(null); return; }
      var dv = devMap[contract.instrument];
      var iv = contract.iv;
      var color, val, tc, cls = '';
      if (viewMode === 'abs') {
        color = cellColor(iv, 'abs');
        val = (iv * 100).toFixed(0);
        tc = textColor(color);
      } else if (dv) {
        color = cellColor(dv.deviation_pt, 'dev');
        val = (dv.deviation_pt > 0 ? '+' : '') + dv.deviation_pt.toFixed(1);
        tc = textColor(color);
        if (Math.abs(dv.z_score) >= 1.5) cls = dv.z_score > 0 ? 'anomaly' : 'anomaly-neg';
      } else {
        color = cellColor(iv, 'abs');
        val = (iv * 100).toFixed(0);
        tc = textColor(color);
      }
      rowVals.push(iv);
      html += '<td class="' + cls + '" style="background:' + color + ';color:' + tc + ';"';
      html += ' onclick="showDetail(' + r.dte + ',' + (contract ? contract.strike : 0) + ')">' + val + '</td>';
    });

    var skew = rowVals[9] && rowVals[0] ? ((rowVals[9] - rowVals[0]) * 100).toFixed(1) : '--';
    var skewColor = skew !== '--' ? (skew > 2 ? '#c62828' : skew < -2 ? '#1565c0' : '#9aa6ba') : '#9aa6ba';
    html += '<td style="font-size:13px;font-weight:700;color:' + skewColor + ';text-align:center;">' + (skew !== '--' ? (skew > 0 ? '+' : '') + skew : '--') + '</td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  container.innerHTML = html;
  renderLegend(minIv, maxIv);
}

function renderLegend(minIv, maxIv) {

    el.innerHTML =
      '<div class="legend-item"><span class="legend-bar" style="background:linear-gradient(90deg,hsl(240,75%,50%),hsl(180,75%,50%),hsl(120,75%,50%),hsl(60,75%,50%),hsl(30,75%,50%),hsl(0,75%,50%));"></span></div>' +
      '<div class="legend-item" style="color:#65718a;">' + selectedCurr + ' IV ' + (minIv !== undefined ? (minIv*100).toFixed(0) + '% → ' + (maxIv*100).toFixed(0) + '%' : '低→高') + '</div>' +
      '<div class="legend-item"><span class="legend-swatch" style="background:#fff;outline:2px solid #e53935;"></span> 偏高异常 (z≥1.5)</div>' +
      '<div class="legend-item"><span class="legend-swatch" style="background:#fff;outline:2px solid #1e88e5;"></span> 偏低异常</div>';
      '<div class="legend-item"><span class="legend-swatch" style="background:#fff;outline:2px solid #1e88e5;"></span> 偏低异常</div>';

      '<div class="legend-item"><span class="legend-bar" style="background:linear-gradient(90deg,#1565c0,#bbdefb,#f5f5f5,#ffcdd2,#e53935,#c62828);"></span></div>' +
      '<div class="legend-item" style="color:#65718a;">偏低&nbsp;→&nbsp;偏高 (SABR 偏差 pt)</div>' +
      '<div class="legend-item"><span class="legend-swatch" style="background:#fff;outline:2px solid #e53935;"></span> 偏高异常</div>' +
      '<div class="legend-item"><span class="legend-swatch" style="background:#fff;outline:2px solid #1e88e5;"></span> 偏低异常</div>';

}

// ---- 信号列表 ----
function renderSignals() {
  var list = document.getElementById('signal-list');
  var allSigs = currentData && currentData.signals ? currentData.signals.signals || [] : [];
  var sigs = allSigs.filter(function(s) { return (s.currency || '').toUpperCase() === selectedCurr; });
  document.getElementById('signal-count').textContent = '(' + sigs.length + '/' + allSigs.length + ')';

  if (sigs.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:24px;color:#9aa6ba;">暂无信号</div>';
    return;
  }

  var html = '';
  sigs.forEach(function(s) {
    var confColor = s.confidence === 'high' ? '#1b9e57' : (s.confidence === 'medium' ? '#e08e0b' : '#9aa6ba');
    // 描述分段显示：按 ":" 和 " + " 拆分
    var desc = s.description || '';
    // 分段：按 [: + (] 拆成多行
    var descHtml = desc
      .replace(/:\s*/g, ':\n')
      .replace(/ \+ /g, '\n')
      .replace(/\(/g, '\n(');
    descHtml = descHtml.replace(/\n/g, '<br>');
    html += '<div class="signal-card">';
    html += '  <div class="title" style="font-size:16px;">' + (s.direction === 'short' ? '做空' : '做多') + ' ' + s.strategy_type + '</div>';
    html += '  <div class="sub" style="font-size:13px;line-height:1.7;">' + descHtml + '</div>';
    html += '  <div class="sub" style="font-size:13px;color:' + confColor + ';font-weight:600;">置信度: ' + s.confidence + '</div>';
    if (typeof s.estimated_delta !== 'undefined') {
      var premStr = (s.expected_premium >= 0 ? '+' : '') + (s.expected_premium || 0).toFixed(5) + ' ' + (s.currency || '');
      var deltaStr = (s.estimated_delta >= 0 ? '+' : '') + (s.estimated_delta || 0).toFixed(3);
      var hedgeStr = (s.hedge_amount > 0 ? (s.hedge_direction === 'long' ? '买' : '卖') + ' ' + s.hedge_amount.toFixed(4) + ' ' + (s.currency || '') + '-PERP' : '—');
      html += '  <div class="sub" style="font-size:13px;">预估权利金: <b>' + premStr + '</b> &nbsp;|&nbsp; 净Δ: <b>' + deltaStr + '</b></div>';
      html += '  <div class="sub" style="font-size:13px;">对冲腿: ' + hedgeStr + '</div>';
    }
    html += '  <div class="actions" style="align-items:center;gap:8px;margin-top:8px;">';
    html += '    <span style="font-size:13px;color:#65718a;">数量</span>';
    html += '    <input type="number" id="qty-' + s.id + '" value="1" min="1" max="999" step="1" style="width:52px;padding:4px 6px;border:1px solid #d4dbe6;border-radius:6px;font-size:13px;text-align:center;">';
    html += '    <button class="btn-execute" onclick="executeSignal(\'' + s.id + '\')" style="font-size:13px;padding:6px 16px;">执行</button>';
    html += '    <button onclick="ignoreSignal(\'' + s.id + '\')" style="font-size:13px;padding:6px 16px;">忽略</button>';
    html += '  </div>';
    html += '</div>';
  });
  list.innerHTML = html;
}

async function executeSignal(id) {
  var qty = parseInt(document.getElementById('qty-' + id)?.value) || 1;
  if (!confirm('确认执行此策略？（数量: ' + qty + ' 手）')) return;
  try {
    await fetch('/api/signal/' + id + '/confirm', {method: 'POST'});
    var r = await fetch('/api/execute', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({signal_id: id, amount: qty})
    });
    var data = await r.json();
    if (data.status !== 'ok') { alert('执行失败: ' + (data.message || '未知错误')); return; }
    // 解析每腿状态，检测部分成交/对冲跳过
    var results = data.results || {};
    var legs = Object.keys(results);
    var errors = legs.filter(function(k){ return results[k] && (results[k].status === 'error' || results[k].status === 'hedge_error'); });
    var skipped = legs.filter(function(k){ return results[k] && results[k].status === 'hedge_skipped'; });
    var okLegs = legs.filter(function(k){ return results[k] && (results[k].status === 'ok' || results[k].status === 'hedge_ok'); });
    var msg = '执行完成：成功 ' + okLegs.length + ' 腿';
    if (errors.length > 0) msg += '，失败 ' + errors.length + ' 腿（' + errors.join(', ') + '）';
    if (skipped.length > 0) msg += '，对冲跳过（' + (results[skipped[0]].reason || '量太小') + '）';
    if (errors.length > 0) {
      msg += '\n\n⚠️ 存在失败腿，可能有单腿敞口！请检查持仓并决定是否手动平掉已成交腿。';
    }
    alert(msg);
    setTimeout(refreshPositions, 500);
    document.getElementById('positions-card').scrollIntoView({behavior:'smooth'});
  } catch(e) { alert('请求失败: ' + e); }
}

async function ignoreSignal(id) {
  await fetch('/api/signal/' + id + '/ignore', {method: 'POST'});
  renderSignals();
}

// ---- 策略持仓管理 ----
async function refreshPositions() {
  try {
    var r = await fetch('/api/positions');
    var data = await r.json();
    var body = document.getElementById('positions-body');
    var positions = data.positions || [];
    var summary = data.summary || {};

    document.getElementById('pos-count').textContent = '(' + positions.length + ')';

    if (positions.length === 0) {
      body.innerHTML = '<div style="text-align:center;padding:24px;color:#9aa6ba;">暂无持仓 — 在信号列表中点击"执行"后自动添加</div>';
      return;
    }

    function pnlColor(v) { return v > 0 ? '#c62828' : (v < 0 ? '#1b9e57' : '#65718a'); }
    function fmtPnl(v) { return (v > 0 ? '+' : '') + v.toFixed(5) + ' '; }

    var html = '';
    // 汇总行
    html += '<div class="pos-summary">';
    html += '  <div class="cell"><div class="l">持仓数</div><div class="n">' + summary.count + '</div></div>';
    html += '  <div class="cell"><div class="l">期权 Delta</div><div class="n" style="color:' + ((summary.options_delta||0) > 0.01 ? '#c62828' : (summary.options_delta||0) < -0.01 ? '#1565c0' : '#1f2733') + ';">' + (summary.options_delta || 0).toFixed(3) + '</div></div>';
    html += '  <div class="cell"><div class="l">账户总 Delta</div><div class="n" style="color:' + ((summary.delta_total||0) > 0.01 ? '#c62828' : (summary.delta_total||0) < -0.01 ? '#1565c0' : '#1f2733') + ';font-size:20px;">' + (summary.delta_total || 0).toFixed(4) + '</div></div>';
    html += '  <div class="cell"><div class="l">Net Gamma</div><div class="n">' + summary.gamma.toFixed(4) + '</div></div>';
    html += '  <div class="cell"><div class="l">Net Vega</div><div class="n">' + (summary.vega * 100).toFixed(0) + '</div></div>';
    html += '  <div class="cell"><div class="l">Net Theta</div><div class="n">' + (summary.theta * 100).toFixed(0) + '/d</div></div>';
    html += '  <div class="cell"><div class="l">未实现盈亏</div><div class="n pnl-big" style="color:' + pnlColor(summary.pnl) + ';">' + (summary.pnl > 0 ? '+' : '') + summary.pnl.toFixed(5) + '</div></div>';
    html += '</div>';

    // 按信号分组（有 signal_id 的合并展示，无 signal_id 的单独展示）
    var groups = {};
    positions.forEach(function(p) {
      var gid = p.signal_id || '__ungrouped__';
      if (!groups[gid]) groups[gid] = [];
      groups[gid].push(p);
    });

    Object.keys(groups).forEach(function(gid) {
      var legs = groups[gid];
      var isGrouped = gid !== '__ungrouped__' && legs.length > 1 && legs[0].strategy_type;

      if (isGrouped) {
        // 策略卡片（多腿合并）
        var p = legs[0];
        var totalPnl = legs.reduce(function(s, x) { return s + (x.unrealized_pnl || 0); }, 0);
        var totalDelta = legs.reduce(function(s, x) { return s + (x.delta || 0); }, 0);
        var dt = new Date(p.executed_at * 1000).toLocaleString();
        html += '<div class="pos-card">';
        html += '  <div class="top"><div class="ttl">' + (p.direction === 'short' ? '做空' : '做多') + ' ' + p.strategy_type + ' | ' + p.currency + '</div>';
        html += '    <div class="pnl-big" style="color:' + pnlColor(totalPnl) + ';">' + (totalPnl > 0 ? '+' : '') + totalPnl.toFixed(5) + '</div></div>';
        html += '  <div class="meta">' + (p.description || '') + '</div>';
        html += '  <div class="pos-grid">';
        html += '    <div class="g"><div class="k">合计 Delta</div><div class="v" style="color:' + (totalDelta > 0.01 ? '#c62828' : totalDelta < -0.01 ? '#1565c0' : '#1f2733') + ';">' + totalDelta.toFixed(4) + '</div></div>';
        html += '    <div class="g"><div class="k">合计 PnL</div><div class="v" style="color:' + pnlColor(totalPnl) + ';">' + (totalPnl > 0 ? '+' : '') + totalPnl.toFixed(5) + '</div></div>';
        html += '  </div>';
        // 逐腿详情
        legs.forEach(function(l) {
          html += '  <div style="font-size:12px;color:#65718a;margin-top:4px;border-top:1px dashed #eef1f5;padding-top:4px;">';
          html += '    ' + (l.size > 0 ? '买' : '卖') + ' ' + Math.abs(l.size).toFixed(1) + 'x ' + l.instrument;
          html += '    &nbsp;Δ=' + (l.delta || 0).toFixed(3) + ' &nbsp;P&L=' + ((l.unrealized_pnl || 0) > 0 ? '+' : '') + (l.unrealized_pnl || 0).toFixed(5);
          html += '  </div>';
        });
        html += '  <div class="meta">' + dt + ' | ID: ' + gid.slice(0,8) + '</div>';
        html += '  <div class="actions" style="margin-top:8px;display:flex;gap:8px;">';
        html += '    <button onclick="closePosition(\'' + gid + '\')" style="padding:5px 14px;border-radius:6px;border:1px solid #e53935;color:#e53935;font-size:12px;cursor:pointer;background:#fff;">平仓</button>';
        html += '  </div>';
        html += '</div>';
      } else {
        // 独立持仓（无 signal_id 或单腿）
        legs.forEach(function(p) {
          var dt = new Date(p.executed_at * 1000).toLocaleString();
          var pnl = p.unrealized_pnl || 0;
          html += '<div class="pos-card">';
          html += '  <div class="top"><div class="ttl">' + (p.size > 0 ? '买' : '卖') + ' ' + Math.abs(p.size).toFixed(1) + 'x ' + p.instrument + '</div>';
          html += '    <div class="pnl-big" style="color:' + pnlColor(pnl) + ';">' + (pnl > 0 ? '+' : '') + pnl.toFixed(5) + '</div></div>';
          html += '  <div class="pos-grid">';
          html += '    <div class="g"><div class="k">Delta</div><div class="v" style="color:' + (p.delta > 0.01 ? '#c62828' : p.delta < -0.01 ? '#1565c0' : '#1f2733') + ';">' + (p.delta || 0).toFixed(4) + '</div></div>';
          html += '    <div class="g"><div class="k">Gamma</div><div class="v">' + (p.gamma || 0).toFixed(4) + '</div></div>';
          html += '    <div class="g"><div class="k">Vega</div><div class="v">' + ((p.vega || 0) * 100).toFixed(0) + '</div></div>';
          html += '    <div class="g"><div class="k">Theta</div><div class="v">' + ((p.theta || 0) * 100).toFixed(0) + '/d</div></div>';
          html += '    <div class="g"><div class="k">入场均价</div><div class="v">' + (p.avg_price || 0).toFixed(1) + '</div></div>';
          html += '    <div class="g"><div class="k">标记价格</div><div class="v">' + (p.mark_price || 0).toFixed(1) + '</div></div>';
          html += '  </div>';
          html += '  <div class="meta">' + dt + '</div>';
          html += '  <div class="actions" style="margin-top:8px;display:flex;gap:8px;">';
          var closeId = p.signal_id || p.instrument;
          html += '    <button onclick="closePosition(\'' + closeId + '\')" style="padding:5px 14px;border-radius:6px;border:1px solid #e53935;color:#e53935;font-size:12px;cursor:pointer;background:#fff;">平仓</button>';
          html += '  </div>';
          html += '</div>';
        });
      }
    });

    html += '<div class="pos-note">* 未实现盈亏按期权腿实时 mark 价格估算（不含永续对冲腿盈亏）；正数为盈利（红）、负数为亏损（绿）。</div>';
    body.innerHTML = html;
  } catch(e) { console.log('positions error:', e); }
}

    var d = await r.json();
    document.getElementById('gl-status').textContent = d.status === 'ok' ? '对冲已停止: ' + cur : '停止失败: ' + d.message;
    document.getElementById('gl-params').style.display = 'none';
    setTimeout(refreshPositions, 500);
  } catch(e) { document.getElementById('gl-status').textContent = '请求失败'; }
}

async function glStatus() {
  try {
    var cur = document.getElementById('gl-currency').value;
    var r = await fetch('/api/gl-hedge/status?currency=' + cur);
    var d = await r.json();
    var panel = document.getElementById('gl-params');
    if (d.status !== 'ok') {
      document.getElementById('gl-status').textContent = '状态查询: ' + (d.message || '无');
      panel.style.display = 'none';
      return;
    }
    document.getElementById('gl-status').textContent = '运行中: ' + (d.is_run ? '是' : '否');
    var p = d.params || {};
    var stateCls = d.is_run ? 'gl-state-run' : 'gl-state-stop';
    var stateTxt = d.is_run ? '运行中' : '已停止';
    var tgt = p.coinTargetDelta != null ? p.coinTargetDelta : 0;
    var tgtTxt = tgt == 0 ? '中性 (0)' : (tgt > 0 ? '+'+tgt : tgt);
    var startTime = p.start_time || d.start_time;
    var stTxt = startTime ? new Date(startTime * 1000).toLocaleString() : '—';
    var fut = p.longFuture || p.shortFuture || '—';
    var otype = p.orderType || 'taker';
    var each = otype === 'maker' ? (p.makerEachOrderSize || '—') : (p.takerEachOrderSize || '—');
    panel.style.display = 'block';
    panel.innerHTML =
      '<div class="row"><span class="k">运行状态</span><span class="v"><span class="gl-state ' + stateCls + '">' + stateTxt + '</span></span></div>' +
      '<div class="row"><span class="k">币种</span><span class="v">' + cur + '</span></div>' +
      '<div class="row"><span class="k">目标 Delta</span><span class="v">' + tgtTxt + '</span></div>' +
      '<div class="row"><span class="k">允许偏离带</span><span class="v">+' + (p.maxPositiveCoinDelta != null ? p.maxPositiveCoinDelta : '—') + ' / -' + (p.maxNegativeCoinDelta != null ? p.maxNegativeCoinDelta : '—') + '</span></div>' +
      '<div class="row"><span class="k">订单类型</span><span class="v">' + otype + '（单笔 ' + each + '）</span></div>' +
      '<div class="row"><span class="k">对冲标的</span><span class="v">' + fut + '</span></div>' +
      '<div class="row"><span class="k">对冲比例</span><span class="v">+' + (p.positiveHedgeRatio != null ? p.positiveHedgeRatio : '—') + '% / -' + (p.negativeHedgeRatio != null ? p.negativeHedgeRatio : '—') + '%</span></div>' +
      '<div class="row"><span class="k">启动时间</span><span class="v">' + stTxt + '</span></div>';
  } catch(e) { document.getElementById('gl-status').textContent = '请求失败'; }
}

// 定时期权持仓
setInterval(refreshPositions, 5000);
</script>
